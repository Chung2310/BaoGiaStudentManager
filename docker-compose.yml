version: '3.8'

services:
  baogia-erp:
    image: ghcr.io/chung2310/baogiastudentmanager:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-baogia-erp}
    restart: always
    ports:
      - "3004:3004"
    env_file:
      - .env
    volumes:
      - .env:/app/.env
    networks:
      - default_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default_network:
    external: true
